<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Enquiry - Customer Enquiry Inbox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .page-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .form-wrapper {
            max-width: 550px;
            width: 100%;
        }
        .form-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 45px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
        }
        .header-section {
            text-align: center;
            margin-bottom: 35px;
        }
        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(40, 167, 69, 0.3);
        }
        .logo-icon i {
            font-size: 36px;
            color: #fff;
        }
        .form-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        .form-subtitle {
            color: #6c757d;
            font-size: 1rem;
        }
        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
        }
        .form-label i {
            color: #28a745;
            margin-right: 6px;
        }
        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #28a745;
            box-shadow: 0 0 0 4px rgba(40, 167, 69, 0.1);
        }
        .form-control::placeholder {
            color: #adb5bd;
        }
        textarea.form-control {
            min-height: 130px;
            resize: vertical;
        }
        .btn-submit {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.3);
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(40, 167, 69, 0.4);
            background: linear-gradient(135deg, #218838 0%, #1ea97c 100%);
        }
        .btn-submit:disabled {
            opacity: 0.7;
            transform: none;
        }
        .message-box {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: none;
            font-weight: 500;
        }
        .message-success {
            background: linear-gradient(135deg, rgba(40, 167, 69, 0.1) 0%, rgba(32, 201, 151, 0.1) 100%);
            color: #0f5132;
            border: 1px solid rgba(40, 167, 69, 0.2);
        }
        .message-error {
            background: linear-gradient(135deg, rgba(220, 53, 69, 0.1) 0%, rgba(253, 126, 20, 0.1) 100%);
            color: #842029;
            border: 1px solid rgba(220, 53, 69, 0.2);
        }
        .nav-links {
            text-align: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #e9ecef;
        }
        .nav-links a {
            color: #6c757d;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .nav-links a:hover {
            color: #28a745;
        }
        .nav-links i {
            margin-right: 6px;
        }
        .invalid-feedback {
            font-size: 0.875rem;
            margin-top: 6px;
        }
        @media (max-width: 576px) {
            .form-card {
                padding: 30px 25px;
            }
            .form-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="form-wrapper">
            <div class="form-card">
                <div class="header-section">
                    <div class="logo-icon">
                        <i class="fas fa-paper-plane"></i>
                    </div>
                    <h1 class="form-title">Submit Your Enquiry</h1>
                    <p class="form-subtitle">We will get back to you as soon as possible</p>
                </div>

                <div id="messageBox" class="message-box"></div>

                <form id="enquiryForm">
                    <div class="mb-4">
                        <label for="name" class="form-label">
                            <i class="fas fa-user"></i> Full Name
                        </label>
                        <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
                        <div class="invalid-feedback">Please enter your name.</div>
                    </div>

                    <div class="mb-4">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope"></i> Email Address
                        </label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email address" required>
                        <div class="invalid-feedback">Please enter a valid email address.</div>
                    </div>

                    <div class="mb-4">
                        <label for="message" class="form-label">
                            <i class="fas fa-comment-dots"></i> Your Message
                        </label>
                        <textarea class="form-control" id="message" placeholder="Describe your enquiry in detail..." required></textarea>
                        <div class="invalid-feedback">Please enter your message.</div>
                    </div>

                    <button type="submit" class="btn btn-submit" id="submitBtn">
                        <i class="fas fa-paper-plane me-2"></i> Submit Enquiry
                    </button>
                </form>

                <div class="nav-links">
                    <a href="index.html"><i class="fas fa-home"></i> Home</a>
                    <a href="staff.html"><i class="fas fa-user-tie"></i> Staff Portal</a>
                    <a href="insights.html"><i class="fas fa-chart-pie"></i> Insights</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3P1Q0t0FRHb6iLuDYopQvL8jMA285XDM",
            authDomain: "customer-enquiry-inbox-52174.firebaseapp.com",
            projectId: "customer-enquiry-inbox-52174",
            storageBucket: "customer-enquiry-inbox-52174.firebasestorage.app",
            messagingSenderId: "881742221818",
            appId: "1:881742221818:web:46dfe2addf53ebc55ed443"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('enquiryForm');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const messageInput = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');
        const messageBox = document.getElementById('messageBox');

        function isValidEmail(email) {
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailPattern.test(email);
        }

        function showMessage(text, isSuccess) {
            messageBox.textContent = text;
            messageBox.className = 'message-box ' + (isSuccess ? 'message-success' : 'message-error');
            messageBox.style.display = 'block';
            
            if (isSuccess) {
                setTimeout(function() {
                    messageBox.style.display = 'none';
                }, 5000);
            }
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            nameInput.classList.remove('is-invalid');
            emailInput.classList.remove('is-invalid');
            messageInput.classList.remove('is-invalid');

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const message = messageInput.value.trim();

            let isValid = true;

            if (name === '') {
                nameInput.classList.add('is-invalid');
                isValid = false;
            }

            if (email === '' || !isValidEmail(email)) {
                emailInput.classList.add('is-invalid');
                isValid = false;
            }

            if (message === '') {
                messageInput.classList.add('is-invalid');
                isValid = false;
            }

            if (!isValid) {
                showMessage('Please fill in all fields correctly.', false);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Submitting...';

            try {
                await addDoc(collection(db, 'enquiries'), {
                    name: name,
                    email: email,
                    message: message,
                    status: 'New',
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp(),
                    internalNotes: ''
                });

                showMessage('Thank you! Your enquiry has been submitted successfully. We will get back to you soon.', true);
                form.reset();

            } catch (error) {
                console.error('Error submitting enquiry:', error);
                showMessage('Error submitting enquiry. Please try again later.', false);
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-paper-plane me-2"></i> Submit Enquiry';
        });
    </script>
</body>
</html>
